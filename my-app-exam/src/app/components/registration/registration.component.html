<div fxLayout="row" style="padding-bottom: 25px">
  <mat-label>Customer Registration</mat-label>
</div>

<div>
  <form [formGroup]="clientForm">
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>First Name</mat-label>
      <input matInput placeholder="First Name" formControlName="firstName">
      <mat-error *ngIf="clientForm.get('firstName')?.hasError('required')">
        First Name is <strong>required</strong>
      </mat-error>
    </mat-form-field>

    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Last Name</mat-label>
      <input matInput placeholder="Last Name" formControlName="lastName">
      <mat-error *ngIf="clientForm.get('lastName')?.hasError('required')">
        Last Name is <strong>required</strong>
      </mat-error>
    </mat-form-field>

    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Phone</mat-label>
      <input matInput placeholder="Phone" formControlName="phone">
      <mat-error *ngIf="clientForm.get('phone')?.hasError('required')">
        Phone is <strong>required</strong>
      </mat-error>
      <mat-error *ngIf="clientForm.get('phone')?.hasError('pattern')">
        Phone is <strong>invalid</strong>
      </mat-error>
    </mat-form-field>
    <mat-form-field class="example-full-width" appearance="fill">
      <mat-label>Email</mat-label>
      <input matInput placeholder="Email" formControlName="email">
      <mat-error *ngIf="clientForm.get('email')?.hasError('required')">
        Email is <strong>required</strong>
      </mat-error>
      <mat-error *ngIf="clientForm.get('email')?.hasError('email')">
        Email is <strong>invalid</strong>
      </mat-error>
    </mat-form-field>
  </form>
</div>

<div fxLayout="row" fxLayoutAlign="end center">
  <button mat-raised-button color="primary" [disabled]="clientForm.invalid" (click)="onSave()">Save</button>
</div>

<div fxLayout="row" style="padding-top: 40px">
  <mat-table matTableResponsive [dataSource]="dataSource" #table fxFill="100">
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef> Id </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.id}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="firstName">
      <mat-header-cell *matHeaderCellDef>First Name</mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.firstName}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="lastName">
      <mat-header-cell *matHeaderCellDef>Last Name</mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.lastName}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="phone">
      <mat-header-cell *matHeaderCellDef>Phone</mat-header-cell>
      <mat-cell *matCellDef="let element"> {{element.phone}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef mat-sort-header></mat-header-cell>
      <mat-cell *matCellDef="let element">
        <div class="button">
          <button mat-button (click)="deleteClient(element.id)"><i class="fa fa-delete" *ngIf="element.id"></i> Delete </button>
        </div>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns; sticky:true"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
</div>
